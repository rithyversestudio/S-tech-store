<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S TECH STORE | Custom PC builds and accessories</title>
  <meta name="description" content="Custom-built PCs and computer accessories.">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <header id="site-header" class="site-header" data-active="home"></header>

  <main>
    <section class="hero">
      <div class="container hero-grid">
        <div class="hero-copy">
          <p class="hero-eyebrow">Custom PCs. Premium parts.</p>
          <h1>Powerful PCs.<br>Built for You.</h1>
          <a class="btn hero-btn" href="#catalog">Shop now</a>
        </div>
      </div>
    </section>

    <section class="section" id="categories">
      <div class="container">
        <h2 class="section-title">Shop by Category</h2>
        <div class="tile-row">
          <a class="tile" href="index.html?type=gaming-pc">
            <img src="images/categories/gaming-pc.jpg" onerror="this.onerror=null;this.src='images/categories/gaming-pc.svg'" alt="" loading="lazy">
            <span>Gaming PCs</span>
          </a>
          <a class="tile" href="index.html?type=creator-pc">
            <img src="images/categories/creator-pc.jpg" onerror="this.onerror=null;this.src='images/categories/creator-pc.svg'" alt="" loading="lazy">
            <span>Creator PCs</span>
          </a>
          <a class="tile" href="index.html?type=office-pc">
            <img src="images/categories/office-pc.jpg" onerror="this.onerror=null;this.src='images/categories/office-pc.svg'" alt="" loading="lazy">
            <span>Office PCs</span>
          </a>
          <a class="tile" href="index.html?type=monitor">
            <img src="images/categories/monitor.jpg" onerror="this.onerror=null;this.src='images/categories/monitor.svg'" alt="" loading="lazy">
            <span>Monitors</span>
          </a>
          <a class="tile" href="index.html?type=keyboard">
            <img src="images/categories/keyboard.jpg" onerror="this.onerror=null;this.src='images/categories/keyboard.svg'" alt="" loading="lazy">
            <span>Keyboards</span>
          </a>
          <a class="tile" href="index.html?type=mouse">
            <img src="images/categories/mouse.jpg" onerror="this.onerror=null;this.src='images/categories/mouse.svg'" alt="" loading="lazy">
            <span>Mice</span>
          </a>
        </div>
      </div>
    </section>

    <section class="section" id="recommended" hidden>
      <div class="container">
        <h2 class="section-title">Recommended for You</h2>
        <div id="rec-row" class="rec-row"></div>
      </div>
    </section>

    <section class="section" id="catalog">
      <div class="container">
        <div id="category-bar" class="category-bar" hidden>
          <a class="btn btn-outline" href="index.html">&larr; Back to home</a>
          <h2 id="category-title"></h2>
        </div>
        <h2 id="products-title">Products</h2>
        <div class="toolbar">
          <label class="field">
            <span>Category</span>
            <select id="category">
              <option value="all">All products</option>
              <option value="pc-builds">PC Builds</option>
              <option value="accessories">Accessories</option>
            </select>
          </label>
          <label class="field">
            <span>Sort by</span>
            <select id="sort">
              <option value="name-asc">Name: A to Z</option>
              <option value="name-desc">Name: Z to A</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
            </select>
          </label>
        </div>
        <p id="status" class="status" role="status" aria-live="polite">Loading products...</p>
        <div id="grid" class="grid"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="scripts/common.js"></script>
  <script src="scripts/app.js"></script>
</body>
</html>
