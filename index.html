<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S TECH STORE | Custom PC builds and accessories</title>
  <meta name="description" content="Custom-built PCs and computer accessories.">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <header id="site-header" class="site-header" data-active="home"></header>

  <main>
    <section class="hero">
      <div class="container">
        <h1>Custom PCs, built and tested in-house.</h1>
        <p>Pick a ready-made build or choose accessories to go with it. Every system ships with a 3-year parts warranty.</p>
        <a class="btn" href="#catalog">Browse products</a>
      </div>
    </section>

    <section class="section" id="categories">
      <div class="container">
        <div class="section-head">
          <h2>Shop by Category</h2>
          <a class="btn-view-all" href="index.html#catalog">View all</a>
        </div>
        <div class="tile-row">
          <a class="tile" href="index.html?type=gaming-pc#catalog">

            <span>Gaming PCs</span>
          </a>
          <a class="tile" href="index.html?type=creator-pc#catalog">
            <svg viewBox="0 0 120 80" aria-hidden="true"><rect x="38" y="6" width="44" height="68" rx="6" fill="#1b1e23"/><rect x="44" y="13" width="32" height="40" rx="3" fill="#3a3f48"/><rect x="49" y="20" width="22" height="8" rx="2" fill="#961b1e"/><rect x="49" y="33" width="22" height="12" rx="2" fill="#5c6370"/><rect x="46" y="60" width="28" height="4" rx="2" fill="#5c6370"/></svg>
            <span>Creator PCs</span>

            <span>Office PCs</span>
          </a>
          <a class="tile" href="index.html?type=monitor#catalog">
            <svg viewBox="0 0 120 80" aria-hidden="true"><rect x="20" y="8" width="80" height="48" rx="4" fill="#1b1e23"/><rect x="26" y="14" width="68" height="36" rx="2" fill="#3a3f48"/><rect x="55" y="56" width="10" height="10" fill="#5c6370"/><rect x="42" y="66" width="36" height="5" rx="2.5" fill="#5c6370"/></svg>
            <span>Monitors</span>
          </a>
          <a class="tile" href="index.html?type=keyboard#catalog">
            <svg viewBox="0 0 120 80" aria-hidden="true"><rect x="12" y="22" width="96" height="38" rx="6" fill="#1b1e23"/><rect x="18" y="28" width="7" height="6" rx="1.5" fill="#5c6370"/><rect x="28" y="28" width="7" height="6" rx="1.5" fill="#5c6370"/><rect x="38" y="28" width="7" height="6" rx="1.5" fill="#5c6370"/><rect x="48" y="28" width="7" height="6" rx="1.5" fill="#5c6370"/><rect x="58" y="28" width="7" height="6" rx="1.5" fill="#5c6370"/><rect x="68" y="28" width="7" height="6" rx="1.5" fill="#5c6370"/><rect x="78" y="28" width="7" height="6" rx="1.5" fill="#5c6370"/><rect x="88" y="28" width="7" height="6" rx="1.5" fill="#5c6370"/><rect x="98" y="28" width="7" height="6" rx="1.5" fill="#5c6370"/><rect x="18" y="37" width="7" height="6" rx="1.5" fill="#5c6370"/><rect x="28" y="37" width="7" height="6" rx="1.5" fill="#5c6370"/><rect x="38" y="37" width="7" height="6" rx="1.5" fill="#5c6370"/><rect x="48" y="37" width="7" height="6" rx="1.5" fill="#5c6370"/><rect x="58" y="37" width="7" height="6" rx="1.5" fill="#5c6370"/><rect x="68" y="37" width="7" height="6" rx="1.5" fill="#5c6370"/><rect x="78" y="37" width="7" height="6" rx="1.5" fill="#5c6370"/><rect x="88" y="37" width="7" height="6" rx="1.5" fill="#5c6370"/><rect x="98" y="37" width="7" height="6" rx="1.5" fill="#5c6370"/><rect x="18" y="46" width="7" height="6" rx="1.5" fill="#5c6370"/><rect x="28" y="46" width="7" height="6" rx="1.5" fill="#5c6370"/><rect x="38" y="46" width="7" height="6" rx="1.5" fill="#5c6370"/><rect x="48" y="46" width="7" height="6" rx="1.5" fill="#5c6370"/><rect x="58" y="46" width="7" height="6" rx="1.5" fill="#5c6370"/><rect x="68" y="46" width="7" height="6" rx="1.5" fill="#5c6370"/><rect x="78" y="46" width="7" height="6" rx="1.5" fill="#5c6370"/><rect x="88" y="46" width="7" height="6" rx="1.5" fill="#5c6370"/><rect x="98" y="46" width="7" height="6" rx="1.5" fill="#5c6370"/><rect x="38" y="54" width="44" height="0" fill="none"/></svg>

          </a>
          <a class="tile" href="index.html?type=mouse#catalog">
            <svg viewBox="0 0 120 80" aria-hidden="true"><rect x="44" y="6" width="32" height="68" rx="16" fill="#1b1e23"/><rect x="59" y="14" width="2" height="20" rx="1" fill="#5c6370"/><rect x="56.5" y="20" width="7" height="10" rx="3.5" fill="#961b1e"/></svg>

          </a>
        </div>
      </div>
    </section>

    <section class="section" id="catalog">
      <div class="container">
        <h2>Products</h2>
        <div class="toolbar">
          <label class="field">
            <span>Search</span>
            <input id="search" type="search" placeholder="Search by name or spec">
          </label>
          <label class="field">
            <span>Category</span>
            <select id="category">
              <option value="all">All products</option>
              <option value="pc-builds">PC Builds</option>
              <option value="accessories">Accessories</option>
            </select>
          </label>
          <label class="field">
            <span>Sort by</span>
            <select id="sort">
              <option value="name-asc">Name: A to Z</option>
              <option value="name-desc">Name: Z to A</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
            </select>
          </label>
        </div>
        <p id="status" class="status" role="status" aria-live="polite">Loading products...</p>
        <div id="grid" class="grid"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="scripts/common.js"></script>
  <script src="scripts/app.js"></script>
